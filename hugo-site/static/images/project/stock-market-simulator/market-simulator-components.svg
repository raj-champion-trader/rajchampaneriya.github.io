<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <marker id="ar3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <filter id="sh3"><feDropShadow dx="1" dy="1" stdDeviation="1" flood-opacity="0.12"/></filter>
  </defs>
  <style>.t { font-size: 20px; font-family: system-ui, sans-serif; fill: #1e293b; } .l { font-size: 16px; font-family: system-ui, sans-serif; fill: #64748b; }</style>
  <rect x="20" y="20" width="560" height="300" rx="12" ry="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 2"/>
  <text x="300" y="52" text-anchor="middle" class="l">Market Simulator Service</text>
  <!-- Program 50,60 90x55 right 140 -->
  <rect x="50" y="60" width="90" height="55" rx="8" ry="8" fill="#f1f5f9" stroke="#64748b" filter="url(#sh3)"/>
  <text x="95" y="92" text-anchor="middle" class="t" font-weight="600">Program.cs</text>
  <text x="95" y="108" text-anchor="middle" class="l">Entry Point</text>
  <!-- ExchangeSimulator 180,50 180x75 right 360 -->
  <rect x="180" y="50" width="180" height="75" rx="8" ry="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#sh3)"/>
  <text x="270" y="82" text-anchor="middle" class="t" font-weight="600">ExchangeSimulator</text>
  <text x="270" y="102" text-anchor="middle" class="l">BackgroundService</text>
  <!-- RealisticPriceEngine 180,145 180x65 right 360 -->
  <rect x="180" y="145" width="180" height="65" rx="8" ry="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#sh3)"/>
  <text x="270" y="178" text-anchor="middle" class="t" font-weight="600">RealisticPriceEngine</text>
  <text x="270" y="196" text-anchor="middle" class="l">GBM + GARCH</text>
  <!-- SymbolProfiles 50,145 110x65 right 160 -->
  <rect x="50" y="145" width="110" height="65" rx="8" ry="8" fill="#f1f5f9" stroke="#64748b" filter="url(#sh3)"/>
  <text x="105" y="178" text-anchor="middle" class="t" font-weight="600">SymbolProfiles</text>
  <text x="105" y="196" text-anchor="middle" class="l">Per-symbol config</text>
  <!-- HttpClientFactory 180,230 130x55 right 310 -->
  <rect x="180" y="230" width="130" height="55" rx="8" ry="8" fill="#f1f5f9" stroke="#64748b" filter="url(#sh3)"/>
  <text x="245" y="262" text-anchor="middle" class="t" font-weight="600">HttpClientFactory</text>
  <!-- Ingestion API 400,200 150x65 left 400 right 550 -->
  <rect x="400" y="200" width="150" height="65" rx="8" ry="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2" filter="url(#sh3)"/>
  <text x="475" y="232" text-anchor="middle" class="t" font-weight="600">Ingestion API</text>
  <text x="475" y="252" text-anchor="middle" class="l">HTTP POST with retry</text>
  <!-- Arrows: Program right 140 to ExchangeSimulator left 180, end 189 -->
  <path d="M 140 87 L 189 87" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#ar3)"/>
  <!-- ExchangeSimulator bottom 125 to PriceEngine top 145, end y 142 -->
  <path d="M 270 125 L 270 142" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#ar3)"/>
  <!-- PriceEngine left 180 to SymbolProfiles right 160, end 151 -->
  <path d="M 180 177 L 151 177" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#ar3)"/>
  <!-- ExchangeSimulator right 360 to HttpClientFactory left 180, end 189 -->
  <path d="M 360 87 L 360 125 L 189 257" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#ar3)"/>
  <!-- HttpClientFactory right 310 to Ingestion left 400, end 409 -->
  <path d="M 310 257 L 409 232" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#ar3)"/>
</svg>
