<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380">
  <defs>
    <marker id="ard" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <filter id="shd"><feDropShadow dx="1" dy="1" stdDeviation="1" flood-opacity="0.12"/></filter>
  </defs>
  <style>.t { font-size: 20px; font-family: system-ui, sans-serif; fill: #1e293b; } .l { font-size: 16px; font-family: system-ui, sans-serif; fill: #64748b; }</style>
  <rect x="20" y="20" width="660" height="340" rx="12" ry="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="350" y="52" text-anchor="middle" class="l">Aspire AppHost - single dotnet run</text>
  <!-- Docker 40,60 300x130 -->
  <rect x="40" y="60" width="300" height="130" rx="10" ry="10" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="3 2"/>
  <text x="190" y="92" text-anchor="middle" class="l">Docker (auto-provisioned)</text>
  <rect x="60" y="105" width="120" height="70" rx="8" ry="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shd)"/>
  <text x="120" y="140" text-anchor="middle" class="t" font-weight="600">Redis 7</text>
  <text x="120" y="158" text-anchor="middle" class="l">+ Data Volume</text>
  <rect x="200" y="105" width="120" height="70" rx="8" ry="8" fill="#f1f5f9" stroke="#64748b" filter="url(#shd)"/>
  <text x="260" y="140" text-anchor="middle" class="t" font-weight="600">Redis Commander</text>
  <text x="260" y="158" text-anchor="middle" class="l">Web UI</text>
  <!-- .NET Services 355,60 305x130 -->
  <rect x="355" y="60" width="305" height="130" rx="10" ry="10" fill="#e0f2fe" stroke="#0ea5e9" stroke-dasharray="3 2"/>
  <text x="507" y="92" text-anchor="middle" class="l">.NET 10 Services</text>
  <rect x="375" y="105" width="95" height="70" rx="8" ry="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2" filter="url(#shd)"/>
  <text x="422" y="140" text-anchor="middle" class="t" font-weight="600">Market Sim</text>
  <text x="422" y="158" text-anchor="middle" class="l">Worker</text>
  <rect x="485" y="105" width="95" height="70" rx="8" ry="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shd)"/>
  <text x="532" y="140" text-anchor="middle" class="t" font-weight="600">Ingestion API</text>
  <text x="532" y="158" text-anchor="middle" class="l">:5001</text>
  <rect x="595" y="105" width="95" height="70" rx="8" ry="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shd)"/>
  <text x="642" y="140" text-anchor="middle" class="t" font-weight="600">Broker Service</text>
  <text x="642" y="158" text-anchor="middle" class="l">:5002</text>
  <!-- Web App 355,205 170x85 left 355 right 525 -->
  <rect x="355" y="205" width="170" height="85" rx="8" ry="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shd)"/>
  <text x="440" y="242" text-anchor="middle" class="t" font-weight="600">Web App</text>
  <text x="440" y="262" text-anchor="middle" class="l">Vite Dev Server :5000</text>
  <!-- Trader View 40,275 130x70 left 40 right 170 -->
  <rect x="40" y="275" width="130" height="70" rx="8" ry="8" fill="#f3e8ff" stroke="#9333ea" stroke-width="2" filter="url(#shd)"/>
  <text x="105" y="312" text-anchor="middle" class="t" font-weight="600">Trader View</text>
  <text x="105" y="330" text-anchor="middle" class="l">Browser</text>
  <!-- Arrows: path end = target edge + 9 so tip touches -->
  <path d="M 470 140 L 494 140" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#ard)"/>
  <path d="M 120 175 L 120 202 L 364 202 L 364 205" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#ard)"/>
  <path d="M 260 175 L 260 202 L 404 202 L 404 205" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#ard)"/>
  <path d="M 642 175 L 642 202 L 440 202 L 440 205" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#ard)"/>
  <path d="M 440 290 L 440 278 L 179 310" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#ard)"/>
</svg>
