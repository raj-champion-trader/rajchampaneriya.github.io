<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <filter id="shw"><feDropShadow dx="1" dy="1" stdDeviation="1" flood-opacity="0.12"/></filter>
  </defs>
  <style>.t { font-size: 20px; font-family: system-ui, sans-serif; fill: #1e293b; } .l { font-size: 16px; font-family: system-ui, sans-serif; fill: #64748b; }</style>
  <rect x="20" y="20" width="600" height="320" rx="12" ry="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 2"/>
  <text x="320" y="52" text-anchor="middle" class="l">Web Application</text>
  <!-- App 50,60 110x60 right 160 -->
  <rect x="50" y="60" width="110" height="60" rx="8" ry="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shw)"/>
  <text x="105" y="92" text-anchor="middle" class="t" font-weight="600">App.tsx</text>
  <text x="105" y="110" text-anchor="middle" class="l">Router</text>
  <!-- Dashboard 190,60 140x60 right 330 -->
  <rect x="190" y="60" width="140" height="60" rx="8" ry="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shw)"/>
  <text x="260" y="92" text-anchor="middle" class="t" font-weight="600">Dashboard</text>
  <text x="260" y="110" text-anchor="middle" class="l">TradingView layout</text>
  <!-- useMarketData 340,60 120x60 right 460 -->
  <rect x="340" y="60" width="120" height="60" rx="8" ry="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shw)"/>
  <text x="400" y="92" text-anchor="middle" class="t" font-weight="600">useMarketData</text>
  <text x="400" y="110" text-anchor="middle" class="l">SSE hook</text>
  <!-- StockCard 190,140 110x60 right 300 -->
  <rect x="190" y="140" width="110" height="60" rx="8" ry="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2" filter="url(#shw)"/>
  <text x="245" y="172" text-anchor="middle" class="t" font-weight="600">StockCard</text>
  <!-- CandlestickChart 310,140 140x60 right 450 -->
  <rect x="310" y="140" width="140" height="60" rx="8" ry="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2" filter="url(#shw)"/>
  <text x="380" y="172" text-anchor="middle" class="t" font-weight="600">CandlestickChart</text>
  <!-- PriceAggregator 460,140 100x60 right 560 -->
  <rect x="460" y="140" width="100" height="60" rx="8" ry="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shw)"/>
  <text x="510" y="172" text-anchor="middle" class="t" font-weight="600">PriceAggregator</text>
  <!-- RedisMonitoring 50,220 120x60 right 170 -->
  <rect x="50" y="220" width="120" height="60" rx="8" ry="8" fill="#f1f5f9" stroke="#64748b" filter="url(#shw)"/>
  <text x="110" y="252" text-anchor="middle" class="t" font-weight="600">RedisMonitoring</text>
  <!-- Navigation 190,220 90x60 right 280 -->
  <rect x="190" y="220" width="90" height="60" rx="8" ry="8" fill="#f1f5f9" stroke="#64748b" filter="url(#shw)"/>
  <text x="235" y="252" text-anchor="middle" class="t" font-weight="600">Navigation</text>
  <!-- Theme 290,220 90x60 right 380 -->
  <rect x="290" y="220" width="90" height="60" rx="8" ry="8" fill="#f1f5f9" stroke="#64748b" filter="url(#shw)"/>
  <text x="335" y="252" text-anchor="middle" class="t" font-weight="600">Theme</text>
  <!-- External: EventSource 510,60 90x60 left 510 right 600 -->
  <rect x="510" y="60" width="90" height="60" rx="8" ry="8" fill="#f1f5f9" stroke="#64748b" filter="url(#shw)"/>
  <text x="555" y="92" text-anchor="middle" class="t" font-weight="600">EventSource API</text>
  <rect x="510" y="140" width="90" height="60" rx="8" ry="8" fill="#f1f5f9" stroke="#64748b" filter="url(#shw)"/>
  <text x="555" y="172" text-anchor="middle" class="t" font-weight="600">D3.js 7.9</text>
  <rect x="510" y="220" width="90" height="60" rx="8" ry="8" fill="#f1f5f9" stroke="#64748b" filter="url(#shw)"/>
  <text x="555" y="252" text-anchor="middle" class="t" font-weight="600">MUI 7</text>
  <!-- Arrows: App right 160 to Dashboard left 190 end 199 -->
  <path d="M 160 90 L 199 90" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arw)"/>
  <path d="M 330 90 L 339 90" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arw)"/>
  <path d="M 260 120 L 260 140" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arw)"/>
  <path d="M 380 120 L 380 140" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arw)"/>
  <path d="M 400 120 L 400 170 L 509 170" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arw)"/>
  <path d="M 105 120 L 105 220" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arw)"/>
</svg>
