<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <marker id="arre" markerWidth="8" markerHeight="8" refX="7" refY="2.5" orient="auto"><path d="M0,0 L0,5 L7,2.5 z" fill="#64748b"/></marker>
    <filter id="she"><feDropShadow dx="0" dy="1" stdDeviation="0.5" flood-opacity="0.1"/></filter>
  </defs>
  <style>.t { font-size: 18px; font-family: system-ui, sans-serif; fill: #1e293b; } .l { font-size: 15px; font-family: system-ui, sans-serif; fill: #64748b; }</style>
  <!-- Market Simulator column -->
  <rect x="20" y="20" width="180" height="260" rx="10" ry="10" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3 2"/>
  <text x="110" y="52" text-anchor="middle" class="l">Market Simulator</text>
  <rect x="45" y="65" width="130" height="45" rx="8" ry="8" fill="#fee2e2" stroke="#dc2626" filter="url(#she)"/>
  <text x="110" y="95" text-anchor="middle" class="t" font-weight="600">HTTP Error</text>
  <path d="M 110 115 L 110 125" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arre)"/>
  <rect x="45" y="130" width="130" height="50" rx="8" ry="8" fill="#ffedd5" stroke="#ea580c" filter="url(#she)"/>
  <text x="110" y="158" text-anchor="middle" class="t">Exponential Backoff</text>
  <text x="110" y="172" text-anchor="middle" class="l">100ms - 200ms - 400ms</text>
  <path d="M 110 185 L 110 195" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arre)"/>
  <rect x="45" y="200" width="130" height="65" rx="8" ry="8" fill="#dbeafe" stroke="#2563eb" filter="url(#she)"/>
  <text x="110" y="232" text-anchor="middle" class="t">Max 3 retries then skip tick</text>
  <!-- Ingestion API column -->
  <rect x="220" y="20" width="180" height="260" rx="10" ry="10" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3 2"/>
  <text x="310" y="52" text-anchor="middle" class="l">Ingestion API</text>
  <rect x="240" y="65" width="140" height="40" rx="8" ry="8" fill="#fee2e2" stroke="#dc2626" filter="url(#she)"/>
  <text x="310" y="92" text-anchor="middle" class="t">Invalid data - 400 ValidationProblem</text>
  <rect x="240" y="115" width="140" height="40" rx="8" ry="8" fill="#fee2e2" stroke="#dc2626" filter="url(#she)"/>
  <text x="310" y="142" text-anchor="middle" class="t">Redis down - 503 Unavailable</text>
  <rect x="240" y="165" width="140" height="40" rx="8" ry="8" fill="#fee2e2" stroke="#dc2626" filter="url(#she)"/>
  <text x="310" y="192" text-anchor="middle" class="t">Redis timeout - 504 Timeout</text>
  <!-- Broker Service column -->
  <rect x="420" y="20" width="180" height="260" rx="10" ry="10" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3 2"/>
  <text x="510" y="52" text-anchor="middle" class="l">Broker Service</text>
  <rect x="440" y="65" width="140" height="40" rx="8" ry="8" fill="#fee2e2" stroke="#dc2626" filter="url(#she)"/>
  <text x="510" y="92" text-anchor="middle" class="t">Redis connection loss - Retry 5s</text>
  <rect x="440" y="115" width="140" height="40" rx="8" ry="8" fill="#fee2e2" stroke="#dc2626" filter="url(#she)"/>
  <text x="510" y="142" text-anchor="middle" class="t">Redis timeout - Retry 2s</text>
  <rect x="440" y="165" width="140" height="40" rx="8" ry="8" fill="#fee2e2" stroke="#dc2626" filter="url(#she)"/>
  <text x="510" y="192" text-anchor="middle" class="t">Unknown error - Retry 10s</text>
  <!-- Web App column -->
  <rect x="620" y="20" width="180" height="260" rx="10" ry="10" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3 2"/>
  <text x="710" y="52" text-anchor="middle" class="l">Web App (SSE)</text>
  <rect x="640" y="65" width="140" height="45" rx="8" ry="8" fill="#fee2e2" stroke="#dc2626" filter="url(#she)"/>
  <text x="710" y="95" text-anchor="middle" class="t" font-weight="600">SSE Error</text>
  <path d="M 710 115 L 710 125" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arre)"/>
  <rect x="640" y="135" width="140" height="60" rx="8" ry="8" fill="#dbeafe" stroke="#2563eb" filter="url(#she)"/>
  <text x="710" y="162" text-anchor="middle" class="t">Attempt &lt;= 5?</text>
  <text x="710" y="178" text-anchor="middle" class="l">Yes: Reconnect</text>
  <rect x="640" y="205" width="140" height="60" rx="8" ry="8" fill="#fee2e2" stroke="#dc2626" filter="url(#she)"/>
  <text x="710" y="238" text-anchor="middle" class="t">No: Show error state</text>
</svg>
