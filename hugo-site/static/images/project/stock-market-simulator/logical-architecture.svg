<svg width="1200" height="720" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg">

  <style>
    text {
      font-family: "Virgil", "Comic Sans MS", cursive;
      fill: #1f2937;
    }
    .layer-title {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 1px;
      fill: #374151;
    }
    .box {
      stroke: #111827;
      stroke-width: 2;
      stroke-dasharray: 4 3;
      rx: 16;
      ry: 16;
    }
    .connector {
      stroke: #374151;
      stroke-width: 2;
      stroke-dasharray: 6 4;
      fill: none;
      marker-end: url(#arrow);
    }
  </style>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-size="26" font-weight="bold">
    Logical Architecture – Stock Market Simulator
  </text>

  <!-- Left-Aligned Layer Titles -->
  <text x="80" y="90" class="layer-title" text-anchor="start">Presentation</text>
  <text x="80" y="210" class="layer-title" text-anchor="start">Application</text>
  <text x="80" y="360" class="layer-title" text-anchor="start">Integration &amp; Data</text>
  <text x="80" y="520" class="layer-title" text-anchor="start">Data Source</text>

  <!-- Presentation Layer -->
  <rect x="200" y="120" width="220" height="80" class="box" fill="#FEF3C7"/>
  <text x="310" y="150" text-anchor="middle" font-size="16" font-weight="bold">Trader / Viewer</text>
  <text x="310" y="170" text-anchor="middle" font-size="13">Actor</text>

  <rect x="480" y="120" width="260" height="80" class="box" fill="#DBEAFE"/>
  <text x="610" y="150" text-anchor="middle" font-size="16" font-weight="bold">Web Frontend</text>
  <text x="610" y="170" text-anchor="middle" font-size="13">React · TypeScript · D3</text>

  <!-- Application Layer -->
  <rect x="350" y="240" width="250" height="90" class="box" fill="#D1FAE5"/>
  <text x="475" y="270" text-anchor="middle" font-size="16" font-weight="bold">Market Ingestion</text>
  <text x="475" y="290" text-anchor="middle" font-size="13">API</text>

  <rect x="650" y="240" width="250" height="90" class="box" fill="#D1FAE5"/>
  <text x="775" y="270" text-anchor="middle" font-size="16" font-weight="bold">Broker Service</text>
  <text x="775" y="290" text-anchor="middle" font-size="13">SSE · Aggregation</text>

  <rect x="930" y="240" width="200" height="90" class="box" fill="#E5E7EB"/>
  <text x="1030" y="270" text-anchor="middle" font-size="16" font-weight="bold">OpenTelemetry</text>
  <text x="1030" y="290" text-anchor="middle" font-size="13">OTLP</text>

  <!-- Integration &amp; Data -->
  <rect x="475" y="390" width="300" height="100" class="box" fill="#E0E7FF"/>
  <text x="625" y="425" text-anchor="middle" font-size="16" font-weight="bold">Redis Streams</text>
  <text x="625" y="445" text-anchor="middle" font-size="13">Message Broker · Consumer Groups</text>

  <!-- Data Source -->
  <rect x="475" y="560" width="300" height="100" class="box" fill="#FCE7F3"/>
  <text x="625" y="595" text-anchor="middle" font-size="16" font-weight="bold">Market Simulator</text>
  <text x="625" y="615" text-anchor="middle" font-size="13">Price Generation (GBM · GARCH)</text>

  <!-- Connectors -->
  <line x1="420" y1="160" x2="480" y2="160" class="connector"/>
  <line x1="610" y1="200" x2="475" y2="240" class="connector"/>
  <line x1="610" y1="200" x2="775" y2="240" class="connector"/>

  <line x1="475" y1="330" x2="625" y2="390" class="connector"/>
  <line x1="775" y1="330" x2="625" y2="390" class="connector"/>

  <line x1="625" y1="490" x2="625" y2="560" class="connector"/>

  <line x1="900" y1="285" x2="930" y2="285" class="connector"/>

</svg>