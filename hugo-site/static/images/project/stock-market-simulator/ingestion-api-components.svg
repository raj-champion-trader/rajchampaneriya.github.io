  <rect x="190" y="145" width="140" height="55" rx="8" ry="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2" filter="url(#shi)"/>
  <text x="260" y="177" text-anchor="middle" class="t" font-weight="600">ValidateMarketData</text>
  <!-- Redis Publisher 340,145 130x55 right 470 -->
  <rect x="340" y="145" width="130" height="55" rx="8" ry="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shi)"/>
  <text x="405" y="177" text-anchor="middle" class="t" font-weight="600">Redis Publisher</text>
  <text x="405" y="192" text-anchor="middle" class="l">XADD</text>
  <!-- 400 ValidationProblem 190,235 120x55 -->
  <rect x="190" y="235" width="120" height="55" rx="8" ry="8" fill="#fee2e2" stroke="#dc2626" filter="url(#shi)"/>
  <text x="250" y="262" text-anchor="middle" class="t" font-weight="600">400 Validation</text>
  <text x="250" y="278" text-anchor="middle" class="l">Problem</text>
  <!-- Redis Streams 400,235 110x60 left 400 right 510 -->
  <rect x="400" y="235" width="110" height="60" rx="8" ry="8" fill="#fee2e2" stroke="#dc2626" filter="url(#shi)"/>
  <text x="455" y="268" text-anchor="middle" class="t" font-weight="600">Redis Streams</text>
  <!-- Market Simulator 50,235 110x55 right 160 -->
  <rect x="50" y="235" width="110" height="55" rx="8" ry="8" fill="#f1f5f9" stroke="#64748b" filter="url(#shi)"/>
  <text x="105" y="267" text-anchor="middle" class="t" font-weight="600">Market Simulator</text>
  <!-- Arrows -->
  <path d="M 270 125 L 270 145" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#ari)"/>
  <path d="M 330 172 L 339 172" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#ari)"/>
  <path d="M 470 200 L 409 265" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#ari)"/>
  <path d="M 260 200 L 260 235" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#ari)"/>
  <path d="M 105 200 L 105 235" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#ari)"/>
