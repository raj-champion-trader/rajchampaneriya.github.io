<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 340" width="580" height="340">
  <defs>
    <marker id="ari" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <filter id="shi"><feDropShadow dx="1" dy="1" stdDeviation="1" flood-opacity="0.12"/></filter>
  </defs>
  <style>.t { font-size: 20px; font-family: system-ui, sans-serif; fill: #1e293b; } .l { font-size: 16px; font-family: system-ui, sans-serif; fill: #64748b; }</style>
  <rect x="20" y="20" width="540" height="300" rx="12" ry="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 2"/>
  <text x="290" y="52" text-anchor="middle" class="l">Market Ingestion API</text>
  <!-- Program 50,60 110x60 right 160 -->
  <rect x="50" y="60" width="110" height="60" rx="8" ry="8" fill="#f1f5f9" stroke="#64748b" filter="url(#shi)"/>
  <text x="105" y="95" text-anchor="middle" class="t" font-weight="600">Program.cs</text>
  <text x="105" y="112" text-anchor="middle" class="l">Minimal API</text>
  <!-- POST /api/marketdata 190,55 160x70 right 350 -->
  <rect x="190" y="55" width="160" height="70" rx="8" ry="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shi)"/>
  <text x="270" y="90" text-anchor="middle" class="t" font-weight="600">POST /api/marketdata</text>
  <text x="270" y="112" text-anchor="middle" class="l">Endpoint</text>
  <!-- GET /health 50,145 90x55 right 140 -->
  <rect x="50" y="145" width="90" height="55" rx="8" ry="8" fill="#f1f5f9" stroke="#64748b" filter="url(#shi)"/>
  <text x="95" y="177" text-anchor="middle" class="t" font-weight="600">GET /health</text>
