<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b" stroke="none"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-opacity="0.15"/>
    </filter>
  </defs>
  <style>
    .excal-text { font-size: 22px; font-family: system-ui, sans-serif; fill: #1e293b; }
    .excal-label { font-size: 16px; font-family: system-ui, sans-serif; fill: #64748b; }
  </style>
  <!-- External Users: rect 20,60 120x80 → right edge 140 -->
  <rect x="20" y="60" width="120" height="80" rx="10" ry="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="2" filter="url(#shadow)"/>
  <text x="80" y="98" text-anchor="middle" class="excal-text" font-weight="600">Trader</text>
  <text x="80" y="118" text-anchor="middle" class="excal-label">External Users</text>
  <!-- System: rect 280,40 220x120 → left edge 280 -->
  <rect x="280" y="40" width="220" height="120" rx="10" ry="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="390" y="82" text-anchor="middle" class="excal-text" font-weight="600">Stock Market Simulator</text>
  <text x="390" y="104" text-anchor="middle" class="excal-text">Real-time market data</text>
  <text x="390" y="126" text-anchor="middle" class="excal-text">streaming system</text>
  <text x="390" y="148" text-anchor="middle" class="excal-label">Stock Market Simulator System</text>
  <!-- Arrow: start at 140 (Trader right), end at 289 (280+9 so tip touches System left) -->
  <path d="M 140 100 L 289 100" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="214" y="92" text-anchor="middle" class="excal-label">Views real-time stock prices via browser</text>
</svg>
