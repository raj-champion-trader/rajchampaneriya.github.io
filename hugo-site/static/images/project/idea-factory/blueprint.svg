<svg width="1200" height="720" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: system-ui, sans-serif; fill: #374151; }
    .layer { font-size: 20px; font-weight: bold; fill: #1f2937; }
    .box { stroke: #6b7280; stroke-width: 2; stroke-dasharray: 6 4; fill: none; rx: 8; }
  </style>
  <rect width="1200" height="720" fill="#f9fafb"/>
  <rect x="200" y="120" width="800" height="120" class="box"/>
  <text x="600" y="185" class="layer" text-anchor="middle">1. Experiment Execution</text>
  <rect x="200" y="300" width="800" height="120" class="box"/>
  <text x="600" y="365" class="layer" text-anchor="middle">2. Evidence Collection</text>
  <rect x="200" y="480" width="800" height="120" class="box"/>
  <text x="600" y="545" class="layer" text-anchor="middle">3. Decision Support</text>
  <text x="600" y="660" text-anchor="middle" font-size="14" fill="#6b7280">Idea Factory  three-layer method</text>
</svg>
