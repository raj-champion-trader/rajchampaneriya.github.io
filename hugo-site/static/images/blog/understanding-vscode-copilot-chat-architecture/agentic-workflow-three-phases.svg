<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520" role="img">
  <title>Agentic workflow: Phase 1 Plan, Phase 2 Generate, Phase 3 Execute</title>
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#475569"/>
    </marker>
  </defs>

  <!-- Phase 1: PLAN (primary blue) -->
  <rect fill="none" stroke="#93c5fd" stroke-dasharray="5 3" stroke-width="1.5" x="24" y="8" width="352" height="128" rx="6"/>
  <text x="200" y="26" text-anchor="middle" font-weight="600" font-size="12px" font-family="system-ui,sans-serif" fill="#1e40af">Phase 1: PLAN</text>

  <rect fill="#dbeafe" stroke="#2563eb" x="44" y="38" width="312" height="28" rx="4"/>
  <text x="200" y="57" text-anchor="middle" font-size="11px" font-family="system-ui,sans-serif" fill="#1e40af">Activate Prompt File - Premium Model</text>

  <line x1="200" y1="66" x2="200" y2="74" stroke="#475569" stroke-width="1" fill="none" marker-end="url(#arr)"/>

  <rect fill="#dbeafe" stroke="#2563eb" x="44" y="74" width="312" height="28" rx="4"/>
  <text x="200" y="93" text-anchor="middle" font-size="11px" font-family="system-ui,sans-serif" fill="#1e40af">Analyze codebase structure</text>

  <line x1="200" y1="102" x2="200" y2="110" stroke="#475569" stroke-width="1" fill="none" marker-end="url(#arr)"/>

  <rect fill="#dbeafe" stroke="#2563eb" x="44" y="110" width="312" height="28" rx="4"/>
  <text x="200" y="129" text-anchor="middle" font-size="11px" font-family="system-ui,sans-serif" fill="#1e40af">Generate commit-by-commit roadmap</text>

  <!-- Plan artifact arrow to Phase 2 -->
  <line x1="200" y1="136" x2="200" y2="158" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="200" y="150" text-anchor="middle" font-size="10px" font-family="system-ui,sans-serif" fill="#64748b">Plan artifact</text>

  <!-- Phase 2: GENERATE (accent orange) -->
  <rect fill="none" stroke="#fdba74" stroke-dasharray="5 3" stroke-width="1.5" x="24" y="158" width="352" height="128" rx="6"/>
  <text x="200" y="176" text-anchor="middle" font-weight="600" font-size="12px" font-family="system-ui,sans-serif" fill="#9a3412">Phase 2: GENERATE</text>

  <rect fill="#ffedd5" stroke="#ea580c" x="44" y="188" width="312" height="28" rx="4"/>
  <text x="200" y="207" text-anchor="middle" font-size="11px" font-family="system-ui,sans-serif" fill="#9a3412">Activate Prompt File - Premium Model</text>

  <line x1="200" y1="216" x2="200" y2="224" stroke="#475569" stroke-width="1" fill="none" marker-end="url(#arr)"/>

  <rect fill="#ffedd5" stroke="#ea580c" x="44" y="224" width="312" height="28" rx="4"/>
  <text x="200" y="243" text-anchor="middle" font-size="11px" font-family="system-ui,sans-serif" fill="#9a3412">Transform plan into implementation blueprint</text>

  <line x1="200" y1="252" x2="200" y2="260" stroke="#475569" stroke-width="1" fill="none" marker-end="url(#arr)"/>

  <rect fill="#ffedd5" stroke="#ea580c" x="44" y="260" width="312" height="28" rx="4"/>
  <text x="200" y="279" text-anchor="middle" font-size="11px" font-family="system-ui,sans-serif" fill="#9a3412">Output: structured markdown with all code</text>

  <!-- Code blueprint arrow to Phase 3 -->
  <line x1="200" y1="286" x2="200" y2="308" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="200" y="300" text-anchor="middle" font-size="10px" font-family="system-ui,sans-serif" fill="#64748b">Code blueprint</text>

  <!-- Phase 3: EXECUTE (secondary green) -->
  <rect fill="none" stroke="#86efac" stroke-dasharray="5 3" stroke-width="1.5" x="24" y="308" width="352" height="204" rx="6"/>
  <text x="200" y="326" text-anchor="middle" font-weight="600" font-size="12px" font-family="system-ui,sans-serif" fill="#166534">Phase 3: EXECUTE</text>

  <rect fill="#dcfce7" stroke="#16a34a" x="44" y="338" width="312" height="28" rx="4"/>
  <text x="200" y="357" text-anchor="middle" font-size="11px" font-family="system-ui,sans-serif" fill="#166534">Activate Custom Agent - Efficient Model</text>

  <line x1="200" y1="366" x2="200" y2="374" stroke="#475569" stroke-width="1" fill="none" marker-end="url(#arr)"/>

  <rect fill="#dcfce7" stroke="#16a34a" x="44" y="374" width="312" height="28" rx="4"/>
  <text x="200" y="393" text-anchor="middle" font-size="11px" font-family="system-ui,sans-serif" fill="#166534">Feed blueprint to agent</text>

  <line x1="200" y1="402" x2="200" y2="410" stroke="#475569" stroke-width="1" fill="none" marker-end="url(#arr)"/>

  <rect fill="#dcfce7" stroke="#16a34a" x="44" y="410" width="312" height="28" rx="4"/>
  <text x="200" y="429" text-anchor="middle" font-size="11px" font-family="system-ui,sans-serif" fill="#166534">Implement - Test - Commit</text>

  <line x1="200" y1="438" x2="200" y2="446" stroke="#475569" stroke-width="1" fill="none" marker-end="url(#arr)"/>

  <rect fill="#dcfce7" stroke="#16a34a" x="44" y="446" width="312" height="28" rx="4"/>
  <text x="200" y="465" text-anchor="middle" font-size="11px" font-family="system-ui,sans-serif" fill="#166534">Repeat until complete</text>
</svg>
