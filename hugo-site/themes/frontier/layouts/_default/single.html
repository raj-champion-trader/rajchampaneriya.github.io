{{ define "main" }}
<article class="single-post">
    <header class="post-header">
        <div class="post-meta">
            <time datetime="{{ .Date.Format " 2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time>
            <span>•</span>
            <span>{{ .ReadingTime }} min read</span>
            <span>•</span>
            <button class="btn-text" onclick="playAudio('{{ .Params.audio | default " /audio/demo.mp3"
                }}', '{{ .Title }}' )">🎧 Listen</button>
        </div>
        <h1>{{ .Title }}</h1>
        {{ with .Params.description }}
        <p class="post-description">{{ . }}</p>
        {{ end }}
    </header>

    <div class="post-content glass-panel">
        {{ .Content }}
    </div>

    <footer class="post-footer">
        <!-- Tags -->
        {{ with .Params.tags }}
        <div class="tags">
            {{ range . }}
            <a href="{{ " tags/" | relLangURL }}{{ . | urlize }}" class="tag">#{{ . }}</a>
            {{ end }}
        </div>
        {{ end }}
    </footer>
</article>
{{ end }}
