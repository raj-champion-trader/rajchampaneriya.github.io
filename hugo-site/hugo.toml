baseURL = 'https://rajc.work/'
languageCode = 'en-us'
title = 'rajc.work'
theme = 'PaperMod'
relativeURLs = false
canonifyURLs = true
buildFuture = true
enableRobotsTXT = true

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[params]
  env = "production"
  description = "Enterprise Architect & Strategic Technology Leader specializing in cloud-native modernization, scalable system design, and AI-driven digital transformation for Fortune 500 enterprises."
  author = "Raj Champaneriya"
  mainSections = ["blog"]
  keywords = ["enterprise architecture", "azure cloud", "solution architecture", "event-driven architecture", "system design", "software engineering", "C4 model", "streaming systems", "real-time data"]
  
  # Assets (Favicons)
  [params.assets]
    favicon = "favicon.svg"
    favicon16x16 = "favicon.svg"
    favicon32x32 = "favicon.svg"
    apple_touch_icon = "favicon.svg"
    safari_pinned_tab = "safari-pinned-tab.svg"
  
  # PaperMod settings
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  # Profile mode (for homepage)
  [params.profileMode]
    enabled = true
    title= "Raj Champaneriya"
    subtitle = "Helping enterprises navigate cloud complexity, modernize legacy platforms, and architect systems that scale."
    imageUrl = "images/profile.jpg"
    imageWidth = 160
    imageHeight = 160
    imageTitle = "Raj Champaneriya"
    buttons = [
      { name = "Architecture Blueprints", url = "/projects" },
      { name = "Thought Leadership", url = "/blog" }
    ]

  # Social links
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/raj-champion-trader"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://linkedin.com/in/rajchampaneriya"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:champaneriyaraj@gmail.com"

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

# Menu configuration
[menu]
  [[menu.main]]
    identifier = "blog"
    name = "Insights"
    url = "/blog/"
    weight = 10

  [[menu.main]]
    identifier = "projects"
    name = "Architecture Blueprints"
    url = "/projects/"
    weight = 20

  [[menu.main]]
    identifier = "about"
    name = "About Me"
    url = "/about/"
    weight = 40

# Taxonomies
[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

# Output formats
[outputs]
  home = ["HTML", "RSS", "JSON"]

# Markup configuration
[markup]
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = false
    lineNos = false
    noClasses = false
    style = "monokai"

  [markup.goldmark.renderer]
    unsafe = true
