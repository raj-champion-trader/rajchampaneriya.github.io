baseURL = 'https://next.rajc.work/'
languageCode = 'en-us'
title = 'rajc.work'
theme = 'frontier'
relativeURLs = true
canonifyURLs = false
buildFuture = true
enableRobotsTXT = true

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[params]
  env = "production"
  description = "IBM Enterprise Architect specializing in high-stakes Fortune 500 transformations — $8M+ modernizations, 99.95% uptime SLAs, and zero-downtime migrations across Healthcare, Insurance, Media & Logistics."
  author = "Raj Champaneriya"
  mainSections = ["blog"]
  keywords = ["enterprise architecture", "IBM enterprise architect", "Fortune 500 transformation", "legacy modernization", "cloud-native architecture", "strategic technology advisory", "azure cloud", "solution architecture", "event-driven architecture", "system design", "CARE architecture method"]
  
  # Assets (Favicons)
  [params.assets]
    favicon = "favicon.svg"
    favicon16x16 = "favicon.svg"
    favicon32x32 = "favicon.svg"
    apple_touch_icon = "favicon.svg"
    safari_pinned_tab = "safari-pinned-tab.svg"
  
  # PaperMod settings
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  # Profile mode (for homepage)
  [params.profileMode]
    enabled = true
    title= "Raj Champaneriya"
    subtitle = "Enterprise Architecture That Protects Careers and Accelerates Transformations"
    imageUrl = "images/profile.jpg"
    imageWidth = 160
    imageHeight = 160
    imageTitle = "Raj Champaneriya — IBM Enterprise Architect"
    buttons = [
      { name = "Architecture Blueprints", url = "/projects" },
      { name = "Strategic Insights", url = "/blog" }
    ]

  # Premium positioning
  [params.premium]
    role = "IBM Enterprise Architect"
    headline = "Enterprise Architect for High-Stakes Transformations"
    tagline = "Enterprise Architecture That Protects Careers and Accelerates Transformations"
    experience = "13+ years across 4 Fortune 500 industries"
    methodology = "The CARE Architecture Method"
    methodologyParts = ["Clarity", "Alignment", "Reality", "Execution"]
    partnerships = ["IBM", "Microsoft Azure", "AWS"]
    certifications = ["Azure AI Engineer (AI-102)", "AWS Solutions Architect", "Microsoft C# Specialist"]
    industries = ["Healthcare", "Property Insurance", "Media & Entertainment", "Logistics"]
    [[params.premium.metrics]]
      value = "$8M+"
      label = "Zero-Downtime Modernization"
    [[params.premium.metrics]]
      value = "99.95%"
      label = "Uptime SLA"
    [[params.premium.metrics]]
      value = "85%"
      label = "Mentee Promotion Rate"
    [[params.premium.metrics]]
      value = "40%"
      label = "Cost Reduction"

  # Social links
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/raj-champion-trader"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://linkedin.com/in/rajchampaneriya"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:raj.champaneriya1@ibm.com"

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

# Menu configuration
[menu]
  [[menu.main]]
    identifier = "blog"
    name = "Insights"
    url = "/blog/"
    weight = 10

  [[menu.main]]
    identifier = "projects"
    name = "Architecture Blueprints"
    url = "/projects/"
    weight = 20

  [[menu.main]]
    identifier = "about"
    name = "About Me"
    url = "/about/"
    weight = 40

# Taxonomies
[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

# Output formats
[outputs]
  home = ["HTML", "RSS", "JSON"]

# Markup configuration
[markup]
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = false
    lineNos = false
    noClasses = false
    style = "monokai"

  [markup.goldmark.renderer]
    unsafe = true
