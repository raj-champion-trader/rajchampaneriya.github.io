{{- /* Search overlay — modal that opens from header search icon */}}
<div id="search-overlay" class="search-overlay" aria-hidden="true">
    <div class="search-overlay-backdrop"></div>
    <div class="search-overlay-content">
        <div class="search-overlay-header">
            <div class="search-overlay-input-wrap">
                <svg class="search-overlay-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input id="search-overlay-input" type="search" placeholder="Search site..." autocomplete="off"
                    aria-label="Search">
                <kbd class="search-overlay-kbd">ESC</kbd>
            </div>
            <button id="search-overlay-close" class="search-overlay-close" aria-label="Close search">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <ul id="search-overlay-results" class="search-overlay-results"></ul>
        <div id="search-overlay-empty" class="search-overlay-empty" style="display:none;">
            No results found
        </div>
    </div>
</div>
