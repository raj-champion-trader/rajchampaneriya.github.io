{{- $src := .Get "src" | default "" -}}
{{- $title := .Get "title" | default "PDF document" -}}
{{- if $src -}}
  {{- $url := $src | relURL -}}
  <div class="pdf-carousel linkedin-style" role="region" aria-label="PDF document">
    <a href="{{ $url }}" target="_blank" rel="noopener" class="pdf-carousel-preview" aria-label="View {{ $title }}">
      <span class="pdf-carousel-icon" aria-hidden="true">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      </span>
      <span class="pdf-carousel-label">PDF</span>
    </a>
    <div class="pdf-carousel-actions">
      <span class="pdf-carousel-title">{{ $title }}</span>
      <div class="pdf-carousel-links">
        <a href="{{ $url }}" target="_blank" rel="noopener" class="pdf-carousel-link">View</a>
        <a href="{{ $url }}" download class="pdf-carousel-link">Download</a>
      </div>
    </div>
  </div>
{{- end -}}
